<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>Pero Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚚</text></svg>">
<style>
:root{--bg:#0b0e13;--bg2:#11161d;--card:#151b23;--line:#232b36;--tx:#e9eef4;--mut:#8a96a5;--acc:#ffb020;--acc2:#ff6a3d;--ok:#3ddc84;--bad:#ff5a4e;--r:14px}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);background-image:radial-gradient(900px 400px at 85% -10%,rgba(255,176,32,.08),transparent),radial-gradient(700px 400px at -10% 10%,rgba(255,106,61,.06),transparent);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:5;background:rgba(11,14,19,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding:12px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.2px;white-space:nowrap}
.logo i{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));font-style:normal;font-size:19px;box-shadow:0 4px 18px rgba(255,140,40,.3)}
.logo span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--bg2);white-space:nowrap}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.pill.live{color:var(--ok);border-color:rgba(61,220,132,.35)}.pill.live .d{background:var(--ok);animation:pulse 1.6s infinite}
.pill.old{color:var(--acc);border-color:rgba(255,176,32,.35)}.pill.old .d{background:var(--acc)}
.pill.off{color:var(--bad);border-color:rgba(255,90,78,.35)}.pill.off .d{background:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.6)}70%{box-shadow:0 0 0 8px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font-size:17px;cursor:pointer;display:grid;place-items:center;flex:none}
.ibtn:hover{border-color:var(--acc)}.ibtn.spin span{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.chip b{font-variant-numeric:tabular-nums;color:var(--mut);font-weight:700}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#1a1000}.chip.on b{color:#1a1000}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat small{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.stat strong{display:block;font-size:26px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}

.hero{position:relative;overflow:hidden;border-radius:18px;padding:20px 22px;margin-bottom:14px;background:linear-gradient(135deg,#2a1a07,#1b120c 55%,#151b23);border:1px solid rgba(255,176,32,.25)}
.hero:after{content:"🚛";position:absolute;right:18px;bottom:-14px;font-size:96px;opacity:.12;transform:scaleX(-1)}
.hero small{color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.8px;font-size:12px}
.route{display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:clamp(20px,4.2vw,30px);font-weight:800;margin:6px 0 4px;position:relative;z-index:1}
.route .arr{color:var(--acc);font-size:.8em}
.hero p{color:var(--mut);position:relative;z-index:1}.hero p b{color:var(--tx)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-bottom:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 6px;min-width:0}
.card h2{display:flex;align-items:center;gap:8px;font-size:15.5px;margin-bottom:6px}
.card h2 em{margin-left:auto;font-style:normal;color:var(--mut);font-size:12px;font-weight:500}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.rk{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:var(--bg2);color:var(--mut)}
.row:nth-of-type(1) .rk{background:var(--acc);color:#1a1000}.row:nth-of-type(2) .rk{background:#c9ced6;color:#111}.row:nth-of-type(3) .rk{background:#c0793a;color:#fff}
.nm{font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{color:var(--mut);font-weight:400;font-size:12.5px;margin-left:6px}
.bar{height:6px;background:var(--bg2);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s}
.cnt{text-align:right;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:34px}
.cnt em{display:block;font-style:normal;font-size:11px;font-weight:700;line-height:1.2}
.up{color:var(--bad)}.dn{color:var(--ok)}.nw{color:var(--acc)}
.empty{color:var(--mut);padding:26px 0;text-align:center}
.more{width:100%;margin:4px 0 10px;padding:9px;border-radius:10px;border:1px dashed var(--line);background:transparent;color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
.more:hover{color:var(--tx);border-color:var(--acc)}
footer{color:var(--mut);font-size:12px;text-align:center;padding:0 16px 26px}

@media(max-width:860px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){
  .wrap{padding:0 12px}
  .hd{gap:8px;padding:10px 0}
  .logo{font-size:17px;gap:8px}.logo i{width:32px;height:32px;font-size:16px}
  .pill{font-size:11.5px;padding:5px 9px}
  .stats{gap:10px}.stat{padding:11px 12px}.stat strong{font-size:21px}
  .hero{padding:16px}.hero:after{font-size:70px}
  .card{padding:14px 12px 4px}
  .nm{white-space:normal}.nm small{display:block;margin:0}
}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <div class="logo"><i>🚚</i><span>Pero Tracker</span></div>
    <div class="sp"></div>
    <span id="stat" class="pill"><span class="d"></span><span class="t">loading…</span></span>
    <button class="ibtn" id="ref" title="Refresh"><span>↻</span></button>
  </div>
</header>

<main class="wrap">
  <div class="chips" id="chips"></div>

  <div class="stats">
    <div class="stat"><small>Players online</small><strong id="sOn">–</strong></div>
    <div class="stat"><small>Trucks tracked</small><strong id="sTr">–</strong></div>
    <div class="stat"><small>Busy roads</small><strong id="sRd">–</strong></div>
    <div class="stat"><small>Updated</small><strong id="sUp">–</strong></div>
  </div>

  <section class="hero">
    <small>🔥 Busiest road right now</small>
    <div class="route" id="hRoute">Loading…</div>
    <p id="hSub"></p>
  </section>

  <div class="grid">
    <section class="card">
      <h2>🛣️ Crowded roads <em>point → point</em></h2>
      <div id="roads"></div>
    </section>
    <section class="card">
      <h2>🏙️ Crowded cities <em>players</em></h2>
      <div id="cities"></div>
    </section>
  </div>
</main>
<footer>Live data from HaulMP · auto refresh every 30s</footer>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NET='haul';   // TruckersMP hidden for now (backend still supports net=tmp)
const FMT={
  roads:[r=>`${esc(r.from)} ⇄ ${esc(r.to)}<small>${esc(r.fromC)}${r.toC&&r.toC!==r.fromC?' / '+esc(r.toC):''}</small>`,r=>r.from+'|'+r.to],
  cities:[r=>`${esc(r.name)}<small>${esc(r.country)}</small>`,r=>r.name]
};
let servers=[],cur=null,prev={},delta={},showAll={roads:false,cities:false},last=null;
try{cur=localStorage.getItem('pero_srv')}catch{}

async function j(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}

// compute change vs previous refresh (only on new data, not on show-all toggle)
function diff(el,arr){
  const [,key]=FMT[el],old=prev[el],now={},dl={};
  arr.forEach(r=>{const k=key(r),o=old?old[k]:undefined;now[k]=r.players;
    dl[k]=!old?'':o==null?'<em class="nw">new</em>':r.players>o?`<em class="up">▲${r.players-o}</em>`:r.players<o?`<em class="dn">▼${o-r.players}</em>`:''});
  prev[el]=now;delta[el]=dl;
}
function list(el,arr){
  const [fmt,key]=FMT[el],box=$(el),dl=delta[el]||{};
  if(!arr.length){box.innerHTML='<div class="empty">No live data right now</div>';return}
  const mx=arr[0].players||1,lim=showAll[el]?arr.length:8;
  box.innerHTML=arr.slice(0,lim).map((r,i)=>`<div class="row"><span class="rk">${i+1}</span><div style="min-width:0"><div class="nm">${fmt(r)}</div><div class="bar"><i style="width:${Math.max(4,r.players/mx*100)}%"></i></div></div><div class="cnt">${r.players}${dl[key(r)]||''}</div></div>`).join('')
    +(arr.length>8?`<button class="more" data-l="${el}">${showAll[el]?'Show less':'Show all '+arr.length}</button>`:'');
}
function chips(){
  $('chips').innerHTML=servers.map(s=>`<button class="chip${s.id===cur?' on':''}" data-id="${esc(s.id)}">${esc(s.name)} <b>${s.players}</b></button>`).join('');
}
function setPill(cls,txt){$('stat').className='pill '+cls;$('stat').querySelector('.t').textContent=txt}

async function load(){
  $('ref').classList.add('spin');
  try{
    const sv=await j('/api?action=servers&net='+NET);servers=sv.servers||[];
    if(!servers.some(s=>s.id===cur))cur=servers[0]?.id||null;
    chips();
    const s=servers.find(x=>x.id===cur);
    $('sOn').textContent=s?s.players:'–';
    if(!s){setPill('off','Servers offline');return}
    const d=await j(`/api?action=hotspots&net=${NET}&server=${encodeURIComponent(s.id)}`);
    if(s.id!==cur)return;
    last=d;diff('roads',d.roads||[]);diff('cities',d.cities||[]);render(d,s);
  }catch(e){setPill('off','Connection error')}
  finally{$('ref').classList.remove('spin')}
}

function render(d,s){
  const age=d.sourceUpdated?Math.max(0,Math.round((Date.now()-d.sourceUpdated)/1000)):null;
  if(d.source==='live')setPill(age!=null&&age>120?'old':'live','LIVE · '+(age==null?'now':age<60?age+'s old':Math.round(age/60)+'m old'));
  else setPill('off','No live data');
  $('sTr').textContent=d.tracked||0;
  $('sRd').textContent=d.roadTotal??(d.roads||[]).length;
  $('sUp').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const R=(d.roads||[])[0],C=(d.cities||[])[0];
  if(R){
    $('hRoute').innerHTML=`${esc(R.from)} <span class="arr">⇄</span> ${esc(R.to)}`;
    $('hSub').innerHTML=`<b>${R.players} players</b> on this road · ${esc(s.name)}`+(C?` · Busiest city: <b>${esc(C.name)}</b> (${C.players})`:'');
  }else{
    $('hRoute').textContent=d.source==='live'?'No crowd right now':'Live map not responding';
    $('hSub').textContent=d.source==='live'?'Roads are quiet on '+s.name:'HaulMP live map is offline — nothing old or fake is shown.';
  }
  list('roads',d.roads||[]);list('cities',d.cities||[]);
}

$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b||b.dataset.id===cur)return;cur=b.dataset.id;try{localStorage.setItem('pero_srv',cur)}catch{};prev={};delta={};chips();load()};
document.addEventListener('click',e=>{const b=e.target.closest('.more');if(!b||!last)return;const el=b.dataset.l;showAll[el]=!showAll[el];list(el,last[el]||[])});
$('ref').onclick=load;
load();setInterval(load,30000);
</script>
</body>
</html>
